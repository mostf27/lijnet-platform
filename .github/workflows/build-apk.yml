name: Build Lijnet Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_py/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-android-apk:
    name: Compile Flet Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install Flet CLI & Build APK
        working-directory: mobile_py
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.25.0" "httpx>=0.27.0"
          flet build apk --build-version 1.0.0 --build-number ${{ github.run_number }}

      - name: Upload Lijnet Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lijnet-Android-APK
          path: mobile_py/build/apk/app-release.apk
          if-no-files-found: error