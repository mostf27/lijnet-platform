name: Lijnet CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Format & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies and CI linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Validate Python imports and code quality (Ruff)
        run: |
          ruff check app tests

      - name: Validate Python code formatting (Ruff)
        run: |
          ruff format --check app tests

      - name: Run automated Pytest suite
        env:
          PYTHONPATH: "."
          APP_ENV: "test"
          SECRET_KEY: "ci-ephemeral-secret-key-not-for-prod"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          pytest -v

  docker-build:
    name: Build & Verify Production Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lijnet production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lijnet-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check container application import
        run: |
          docker run --rm \
            -e APP_ENV=test \
            -e SECRET_KEY=ci-docker-smoke-secret \
            -e DATABASE_URL=sqlite:///./docker_smoke.db \
            lijnet-web:${{ github.sha }} \
            python -c "import app.main; print('Lijnet container image verified OK')"