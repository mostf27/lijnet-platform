name: Lijnet CI & CD

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Format & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies and CI linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Validate Python imports and code quality (Ruff)
        run: |
          ruff check app tests

      - name: Validate Python code formatting (Ruff)
        run: |
          ruff format --check app tests

      - name: Run automated Pytest suite
        env:
          PYTHONPATH: "."
          APP_ENV: "test"
          SECRET_KEY: "ci-ephemeral-secret-key-not-for-prod"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          pytest -v

  docker-build:
    name: Build & Verify Production Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lijnet production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lijnet-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check container application import
        run: |
          docker run --rm \
            -e APP_ENV=test \
            -e SECRET_KEY=ci-docker-smoke-secret \
            -e DATABASE_URL=sqlite:///./docker_smoke.db \
            lijnet-web:${{ github.sha }} \
            python -c "import app.main; print('Lijnet container image verified OK')"

  deploy:
    name: Deploy to Ethiopian Ubuntu VPS
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy & Verify Healthcheck via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          envs: VPS_APP_DIR
          script: |
            set -euo pipefail
            APP_DIR="${VPS_APP_DIR:-/opt/lijnet-platform}"
            cd "$APP_DIR"

            if [ ! -f .env.prod ]; then
              echo "ERROR: .env.prod not found in $APP_DIR"
              exit 1
            fi

            echo "Pulling latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Rebuilding production stack..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans
            docker image prune -f

            echo "Verifying /healthz through Nginx..."
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1/healthz | grep -Eq '"status"\s*:\s*"ok"'; then
                echo "SUCCESS: Lijnet production deployment verified healthy."
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: /healthz failed after 30s. Dumping recent logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 web nginx
            exit 1
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}