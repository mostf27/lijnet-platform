{% extends "base.html" %}
{% block title %}Admin Login — {{ t.brand_name }}{% endblock %}
{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white rounded-2xl border border-stone-200 p-7 shadow-sm">
  <div class="text-center mb-6">
    <div class="w-12 h-12 mx-auto rounded-xl bg-nile text-honey font-heading font-extrabold text-2xl flex items-center justify-center mb-3">
      ል
    </div>
    <h1 class="font-heading text-xl font-extrabold text-nile">Lijnet Admin Portal</h1>
    <p class="text-xs text-stone-500 mt-1">Sign in with your verified administrator email or Ethiopian phone</p>
  </div>

  {% if error %}
  <div class="mb-4 bg-terracotta/15 border border-terracotta text-terracotta px-3 py-2.5 rounded-lg text-xs font-semibold">
    ⚠️ {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/admin/login" class="space-y-4">
    <input type="hidden" name="next_url" value="{{ next_url }}" />

    <div>
      <label class="block text-xs font-semibold text-stone-700 mb-1">Admin Email or Phone</label>
      <input type="text" name="identifier" required autofocus
             placeholder="admin@lijnet.et or +251911000001"
             class="w-full border border-stone-300 rounded-lg px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-nile focus:outline-none" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-stone-700 mb-1">Password</label>
      <input type="password" name="password" required placeholder="••••••••••••"
             class="w-full border border-stone-300 rounded-lg px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-nile focus:outline-none" />
    </div>

    <button type="submit" class="w-full bg-nile hover:bg-[#125563] text-white font-bold py-2.5 rounded-lg text-sm transition">
      Sign In to Dispatch Console
    </button>
  </form>
</div>
{% endblock %}
